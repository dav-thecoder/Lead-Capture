<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book an Appointment</title><link rel="stylesheet" href="/static/style.css"></head><body><main><section><p class="tag">FAST • SIMPLE • EASY</p><h1>Book an appointment.</h1><p>Send us your information and choose the date and time that works best for you. We’ll contact you to confirm.</p></section><form method="post"><h2>Request an appointment</h2>{% with messages=get_flashed_messages() %}{% for m in messages %}<p class="error">{{m}}</p>{% endfor %}{% endwith %}<label>Full name *</label><input name="name" required><label>Phone number *</label><input name="phone" required><label>Email</label><input name="email" type="email"><label>What can we help with?</label><select name="service"><option>General appointment</option><option>Product inquiry</option><option>Financing / payment options</option><option>Service / support</option><option>Other</option></select><div class="grid"><div><label>Preferred date</label><input name="appointment_date" type="date"></div><div><label>Preferred time</label><input name="appointment_time" type="time"></div></div><label>Notes</label><textarea name="notes" rows="4"></textarea><button>Request Appointment</button></form></main></body></html>
